<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#050506;--bg2:#17140c;--sf:#0f1014cc;--ln:#ffffff17;--tx:#f3ecdb;--mu:#8e8a7d;--gd:#d4af61;--gd2:#8a6d2f;--gd3:#f4dea0;--fc:#0a0a0d;--fa:#1d1b14;--fb:#050506;--gi:.6;--dg:#e5786b;
color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
:root[data-theme=light]{--bg:#f3eee2;--bg2:#e6dcc3;--sf:#fffaf0d9;--ln:#3b2e0f22;--tx:#221b0b;--mu:#766d58;--gd:#94701f;--gd2:#6e5216;--gd3:#c39b42;--fc:#fbf6ea;--fa:#fffdf6;--fb:#e9dec3;color-scheme:light}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;min-height:100vh;color:var(--tx);font:16px/1.5 Inter,system-ui,sans-serif;padding-bottom:120px;background:radial-gradient(110% 55% at 50% -8%,var(--bg2),var(--bg) 70%) fixed}
header{display:flex;justify-content:space-between;align-items:center;max-width:980px;margin:0 auto;padding:18px 22px 6px}
.brand{font:300 1.45rem "Cormorant Garamond",Georgia,serif;letter-spacing:.42em;color:var(--gd)}
main{max-width:520px;margin:0 auto;padding:6px 16px}
.pane{display:none}.pane.on{display:block;animation:in .45s cubic-bezier(.2,.7,.2,1)}
@keyframes in{from{opacity:0;transform:translateY(12px)}}
.card{background:var(--sf);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border:1px solid var(--ln);border-radius:26px;padding:22px 18px;margin-bottom:14px;box-shadow:0 22px 44px -26px #000,inset 0 1px 0 #ffffff12}
.big{font:300 clamp(3.1rem,17vw,5rem)/1.05 "Cormorant Garamond",Georgia,serif;font-variant-numeric:tabular-nums;text-align:center;text-shadow:0 0 calc(34px*var(--gi)) var(--gd2)}
.big small{font:600 .24em Inter,sans-serif;color:var(--gd);margin-left:8px;letter-spacing:.12em}
.mu{color:var(--mu);font-size:.85rem}
.dt{text-align:center;color:var(--mu);margin:8px 0 0}
.row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:20px}
button,input{font:inherit;color:inherit}
button{cursor:pointer;border:1px solid var(--ln);background:transparent;border-radius:999px;padding:10px 20px;min-height:46px;transition:transform .15s,border-color .25s,background .25s}
button:active{transform:scale(.95)}
@media(hover:hover){button:hover{border-color:var(--gd2)}}
button.p{background:linear-gradient(180deg,var(--gd3),var(--gd));color:#17120a;border-color:var(--gd);font-weight:600}
button.d{color:var(--dg)}
button:disabled{opacity:.35}
:focus-visible{outline:2px solid var(--gd);outline-offset:3px}
input{background:#00000022;border:1px solid var(--ln);border-radius:14px;padding:10px 14px;min-height:48px;width:100%}
input.sw{appearance:none;-webkit-appearance:none;width:50px;min-height:0;height:28px;padding:0;border-radius:99px;position:relative;cursor:pointer;flex:none;transition:.25s}
input.sw::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:var(--tx);transition:.25s}
input.sw:checked{background:var(--gd);border-color:var(--gd)}
input.sw:checked::after{transform:translateX(22px);background:var(--fc)}
input[type=range]{width:55%;min-height:32px;padding:0;accent-color:var(--gd);background:none;border:0}
.watch{position:relative;width:min(78vw,320px);aspect-ratio:1;margin:0 auto;border-radius:50%;padding:9px;background:conic-gradient(from 210deg,#f4dea0,#8a6d2f,#e8cf8a,#6d5423,#f4dea0);box-shadow:0 26px 50px -20px #000,0 0 calc(46px*var(--gi)) -8px var(--gd)}
.watch svg{width:100%;height:100%;display:block;border-radius:50%}
.shine{position:absolute;inset:9px;border-radius:50%;overflow:hidden;pointer-events:none}
.shine::before{content:"";position:absolute;inset:-50%;background:conic-gradient(transparent 0 42%,#ffffff1c 49%,transparent 56%);animation:spin 16s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.wc{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:16px 18px;margin-bottom:12px}
.cn{font:500 1.25rem "Cormorant Garamond",Georgia,serif}
.wt{display:flex;align-items:center;gap:6px}
.wt b{font:500 1.75rem "Cormorant Garamond",Georgia,serif;font-variant-numeric:tabular-nums}
.wt i{font:600 .68rem Inter;font-style:normal;color:var(--gd)}
.dot{width:9px;height:9px;border-radius:50%;background:var(--gd);margin-left:4px}
.dot.n{background:none;box-shadow:inset -3px -1px 0 var(--mu)}
.f{display:grid;gap:10px}
.al{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:16px 18px;margin-bottom:12px}
.al b{font:500 1.9rem "Cormorant Garamond",Georgia,serif}
.al.off{opacity:.55}
.ac{display:flex;align-items:center;gap:6px}
.ac button{padding:6px 12px;min-height:38px;font-size:.85rem}
.tr{position:relative;width:min(66vw,270px);aspect-ratio:1;margin:0 auto}
.tr svg{width:100%;height:100%}
.tr .big{position:absolute;inset:0;display:grid;place-items:center;font-size:clamp(2rem,10vw,2.8rem)}
.done .tr{animation:pl 1s ease 3}
@keyframes pl{50%{transform:scale(1.06);filter:drop-shadow(0 0 22px var(--gd))}}
.ti{display:flex;gap:10px;margin-top:16px}.ti label{flex:1}
.lap{display:flex;justify-content:space-between;padding:12px 4px;border-bottom:1px solid var(--ln)}
.lap b{font-variant-numeric:tabular-nums;font-weight:500}
nav{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(12px + env(safe-area-inset-bottom,0px));width:min(94vw,470px);display:flex;padding:6px;border-radius:999px;background:var(--sf);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border:1px solid var(--ln);box-shadow:0 18px 40px -12px #000a;z-index:5}
nav button{flex:1;border:0;padding:10px 0 14px;position:relative;font-size:.76rem;color:var(--mu)}
nav button::after{content:"";position:absolute;left:50%;bottom:7px;width:16px;height:3px;margin-left:-8px;border-radius:3px;background:var(--gd);transform:scaleX(0);transition:transform .3s}
nav button.on{color:var(--gd)}nav button.on::after{transform:scaleX(1)}
#st,#ring{position:fixed;inset:0;background:#000c;z-index:9;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;padding:16px}
#ring{justify-content:center;gap:22px;text-align:center}
#st[hidden],#ring[hidden]{display:none}
#ring h2{font:300 2.3rem "Cormorant Garamond",Georgia,serif;margin:0;color:var(--gd3)}
.sheet{width:min(100%,480px);background:var(--bg2);animation:in .35s}
.rw{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 0;border-bottom:1px solid var(--ln)}
.seg{display:flex;border:1px solid var(--ln);border-radius:99px;padding:3px}
.seg button{border:0;padding:6px 16px;min-height:36px}.seg .on{background:var(--gd);color:var(--fc)}
#sp{position:fixed;inset:0;z-index:20;background:var(--bg);display:grid;place-items:center;text-align:center;animation:sp .6s ease 1.5s forwards}
#sp b{font:300 1.7rem "Cormorant Garamond",Georgia,serif;letter-spacing:.5em;color:var(--gd);margin-right:-.5em;animation:fi 1.2s ease both}
#sp i{display:block;height:1px;background:var(--gd);margin:14px auto 0;animation:gr 1.3s ease both}
@keyframes fi{from{opacity:0;letter-spacing:.9em}}
@keyframes gr{from{width:0}to{width:100%}}
@keyframes sp{to{opacity:0;visibility:hidden}}
@media(min-width:820px){main{max-width:980px}#clock.on{display:grid;grid-template-columns:1fr 1fr;gap:16px;align-items:center}#wl{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}.pane:not(#clock):not(#world){max-width:520px;margin:0 auto}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
<linearGradient id="gg" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="200" y2="200"><stop offset="0" stop-color="#f4dea0"/><stop offset=".4" stop-color="#b8913f"/><stop offset=".7" stop-color="#7a5c22"/><stop offset="1" stop-color="#e8cf8a"/></linearGradient>
<radialGradient id="fg"><stop offset="0" style="stop-color:var(--fa)"/><stop offset="1" style="stop-color:var(--fb)"/></radialGradient>
</defs></svg>

<div id="sp"><div><b>CHRONOS</b><i></i></div></div>
<header><span class="brand">CHRONOS</span>
<button id="gs" aria-label="Settings"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M4 7h10M18 7h2M4 17h2M10 17h10"/><circle cx="16" cy="7" r="2"/><circle cx="8" cy="17" r="2"/></svg></button></header>
<main>
<section id="clock" class="pane on">
  <div class="card">
    <div class="big" id="dig"></div>
    <p class="dt" id="dt"></p>
    <div class="row"><button id="fmt"></button></div>
  </div>
  <div class="watch">
    <svg viewBox="0 0 200 200" aria-label="Analog watch">
      <circle cx="100" cy="100" r="99" fill="url(#fg)"/>
      <circle cx="100" cy="100" r="94" fill="none" stroke="var(--gd2)" stroke-width=".6"/>
      <circle cx="100" cy="100" r="55" fill="none" stroke="var(--ln)" stroke-width=".8"/>
      <g id="tk"></g>
      <text x="100" y="134" text-anchor="middle" font-size="5" letter-spacing="2.4" fill="var(--gd)" font-family="Inter,sans-serif">CHRONOS</text>
      <g style="filter:drop-shadow(0 3px 2px #0009)">
        <polygon id="hh" points="96.5,110 100,50 103.5,110" fill="url(#gg)"/>
        <polygon id="mh" points="97.6,112 100,30 102.4,112" fill="url(#gg)"/>
        <g id="sh"><line x1="100" y1="123" x2="100" y2="22" stroke="var(--gd3)" stroke-width="1.1"/><circle cx="100" cy="122" r="3" fill="var(--gd3)"/></g>
      </g>
      <circle cx="100" cy="100" r="6" fill="url(#gg)"/><circle cx="100" cy="100" r="2.4" fill="var(--fc)"/>
    </svg>
    <div class="shine"></div>
  </div>
</section>

<section id="world" class="pane"><div id="wl"></div></section>

<section id="alarm" class="pane">
  <div class="card f">
    <input type="time" id="at" aria-label="Alarm time" value="07:00">
    <input type="text" id="an" placeholder="Alarm name" aria-label="Alarm name" maxlength="40">
    <button class="p" id="aa">Add alarm</button>
    <button id="ac" hidden>Cancel editing</button>
  </div>
  <div id="al"></div>
  <p class="mu" id="ae" style="text-align:center">No alarms yet. Pick a time above and add one.</p>
  <p class="mu" style="text-align:center">Alarms ring only while this page stays open.</p>
</section>

<section id="sw" class="pane">
  <div class="card">
    <div class="big" id="swd">00:00.00</div>
    <div class="row"><button class="p" id="sgo">Start</button><button id="slap" disabled>Lap</button><button id="srs">Reset</button></div>
  </div>
  <div class="card" id="lc" hidden><div id="laps"></div></div>
</section>

<section id="tm" class="pane">
  <div class="card">
    <div class="tr"><svg viewBox="0 0 200 200"><circle cx="100" cy="100" r="88" fill="none" stroke="var(--ln)" stroke-width="6"/><circle id="pr" cx="100" cy="100" r="88" fill="none" stroke="url(#gg)" stroke-width="6" stroke-linecap="round" stroke-dasharray="553" stroke-dashoffset="0" transform="rotate(-90 100 100)"/></svg><div class="big" id="tmd">00:05:00</div></div>
    <div class="ti" id="tin">
      <label class="mu">Minutes<input type="number" id="tmm" min="0" max="999" value="5" inputmode="numeric"></label>
      <label class="mu">Seconds<input type="number" id="tms" min="0" max="59" value="0" inputmode="numeric"></label>
    </div>
    <div class="row"><button class="p" id="tgo">Start</button><button id="trs">Reset</button></div>
  </div>
</section>
</main>

<nav id="nv"><button data-t="clock" class="on">Clock</button><button data-t="world">World</button><button data-t="alarm">Alarm</button><button data-t="sw">Stopwatch</button><button data-t="tm">Timer</button></nav>

<div id="st" hidden><div class="sheet card">
  <div class="rw"><span>Time format</span><div class="seg" data-k="h24"><button data-v="0">12h</button><button data-v="1">24h</button></div></div>
  <div class="rw"><span>Theme</span><div class="seg" data-k="theme"><button data-v="dark">Dark</button><button data-v="light">Light</button></div></div>
  <div class="rw"><span>Gold intensity</span><input type="range" id="gi" min=".2" max="1" step=".05"></div>
  <div class="rw"><span>Ticking sound</span><input type="checkbox" class="sw" id="tk2"></div>
  <div class="rw"><span>Vibration</span><input type="checkbox" class="sw" id="vb"></div>
  <div class="rw" id="fsr"><span>Fullscreen</span><button id="fs">Enter</button></div>
  <div class="row"><button class="p" id="sx">Done</button></div>
</div></div>
<div id="ring" hidden><h2 id="rm"></h2><button class="p" id="rx">Dismiss</button></div>

<script>
const $=s=>document.querySelector(s),$$=s=>document.querySelectorAll(s),p2=n=>String(n).padStart(2,'0');
const ld=(k,d)=>{try{const v=localStorage.getItem(k);return v===null?d:JSON.parse(v)}catch(e){return d}};
const sv=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}};
const esc=s=>String(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const RM=matchMedia('(prefers-reduced-motion:reduce)').matches;
const S=Object.assign({h24:ld('h24',false),theme:ld('theme','dark'),gi:.6,tick:false,vib:true},ld('chronos',{}));
let alarms=ld('alarms',[]),ctx=null,ringIv=null,lastSec=-1,lastMin=-1,fired={},edit=null,cur='clock';
const ft=(h,m,s)=>S.h24?[`${p2(h)}:${p2(m)}:${p2(s)}`,'']:[`${p2(h%12||12)}:${p2(m)}:${p2(s)}`,h<12?'AM':'PM'];
const hm=t=>{const[h,m]=t.split(':').map(Number),r=ft(h,m,0);return r[0].slice(0,5)+(r[1]?' '+r[1]:'')};
const vib=n=>{try{S.vib&&navigator.vibrate&&navigator.vibrate(n)}catch(e){}};
document.addEventListener('click',e=>{if(e.target.closest('button'))vib(8)});

/* Settings */
function apply(){const r=document.documentElement;r.dataset.theme=S.theme;r.style.setProperty('--gi',S.gi);
  $$('.seg').forEach(g=>g.querySelectorAll('button').forEach(b=>b.classList.toggle('on',b.dataset.v===(g.dataset.k==='h24'?(S.h24?'1':'0'):S.theme))));
  $('#gi').value=S.gi;$('#tk2').checked=S.tick;$('#vb').checked=S.vib;$('#fmt').textContent=S.h24?'Switch to 12-hour':'Switch to 24-hour';
  sv('chronos',S);sv('h24',S.h24);sv('theme',S.theme);lastSec=-1;ra()}
$$('.seg').forEach(g=>g.onclick=e=>{const b=e.target.closest('button');if(!b)return;S[g.dataset.k]=g.dataset.k==='h24'?b.dataset.v==='1':b.dataset.v;apply()});
$('#fmt').onclick=()=>{S.h24=!S.h24;apply()};
$('#gi').oninput=e=>{S.gi=+e.target.value;apply()};
$('#tk2').onchange=e=>{S.tick=e.target.checked;apply()};
$('#vb').onchange=e=>{S.vib=e.target.checked;apply();vib(30)};
$('#gs').onclick=()=>$('#st').hidden=false;
$('#sx').onclick=()=>$('#st').hidden=true;
$('#st').onclick=e=>{if(e.target.id==='st')$('#st').hidden=true};
if(!(document.fullscreenEnabled||document.webkitFullscreenEnabled))$('#fsr').hidden=true;
$('#fs').onclick=()=>{try{document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen()}catch(e){}};
document.onfullscreenchange=()=>$('#fs').textContent=document.fullscreenElement?'Exit':'Enter';

/* Tabs */
$('#nv').onclick=e=>{const b=e.target.closest('button');if(!b)return;cur=b.dataset.t;
  $$('.pane').forEach(x=>x.classList.toggle('on',x.id===cur));$$('nav button').forEach(x=>x.classList.toggle('on',x===b));lastSec=-1;scrollTo(0,0)};

/* Watch dial */
(function(){let s='';for(let i=0;i<60;i++){const a=i*6*Math.PI/180,b=i%5===0,r1=b?80:85,r2=89,sn=Math.sin(a),cs=Math.cos(a);
  s+=`<line x1="${100+r1*sn}" y1="${100-r1*cs}" x2="${100+r2*sn}" y2="${100-r2*cs}" stroke="${b?'url(#gg)':'var(--mu)'}" stroke-width="${b?2.4:.7}"/>`}
  ['XII','I','II','III','IIII','V','VI','VII','VIII','IX','X','XI'].forEach((n,i)=>{const a=i*30*Math.PI/180;
    s+=`<text x="${100+66*Math.sin(a)}" y="${100-66*Math.cos(a)+3.6}" text-anchor="middle" font-size="10" fill="var(--tx)" font-family="Cormorant Garamond,Georgia,serif">${n}</text>`});
  $('#tk').innerHTML=s})();
const rot=(id,d)=>$(id).setAttribute('transform',`rotate(${d} 100 100)`);

/* World clock */
const Z=[['Delhi','Asia/Kolkata'],['London','Europe/London'],['New York','America/New_York'],['Tokyo','Asia/Tokyo'],['Dubai','Asia/Dubai'],['Sydney','Australia/Sydney']];
const wf=Z.map(c=>new Intl.DateTimeFormat('en-GB',{timeZone:c[1],hourCycle:'h23',hour:'2-digit',minute:'2-digit',second:'2-digit',weekday:'long'}));
const offs=Z.map(c=>{try{return new Intl.DateTimeFormat('en',{timeZone:c[1],timeZoneName:'shortOffset'}).formatToParts(new Date()).find(p=>p.type==='timeZoneName').value}catch(e){return''}});
function world(d){$('#wl').innerHTML=Z.map((c,i)=>{const o={};wf[i].formatToParts(d).forEach(p=>o[p.type]=p.value);
  const h=+o.hour%24,t=ft(h,+o.minute,+o.second),n=h<6||h>=18;
  return `<div class="card wc"><div><div class="cn">${c[0]}</div><span class="mu">${o.weekday}, ${offs[i]}</span></div><div class="wt"><b>${t[0]}</b><i>${t[1]}</i><span class="dot ${n?'n':''}" title="${n?'Night':'Day'}"></span></div></div>`}).join('')}

/* Sound */
function beep(){try{ctx=ctx||new(window.AudioContext||window.webkitAudioContext)();ctx.resume();
  const o=ctx.createOscillator(),g=ctx.createGain(),t=ctx.currentTime;o.type='sine';o.frequency.value=880;
  g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.5,t+.05);g.gain.exponentialRampToValueAtTime(.0001,t+.7);
  o.connect(g);g.connect(ctx.destination);o.start();o.stop(t+.75)}catch(e){}}
function tick(){if(!S.tick||!ctx)return;try{const o=ctx.createOscillator(),g=ctx.createGain(),t=ctx.currentTime;o.frequency.value=2200;
  g.gain.setValueAtTime(.05,t);g.gain.exponentialRampToValueAtTime(.0001,t+.04);o.connect(g);g.connect(ctx.destination);o.start();o.stop(t+.05)}catch(e){}}
addEventListener('pointerdown',()=>{try{ctx=ctx||new(window.AudioContext||window.webkitAudioContext)();ctx.resume()}catch(e){}},{once:true});
function ring(m){$('#rm').textContent=m;$('#ring').hidden=false;beep();vib([300,150,300]);clearInterval(ringIv);ringIv=setInterval(()=>{beep();vib(300)},1200)}
$('#rx').onclick=()=>{$('#ring').hidden=true;clearInterval(ringIv)};

/* Alarms */
function nxt(a){if(!a.on)return'Off';const d=new Date(),[h,m]=a.t.split(':').map(Number),x=new Date(d);x.setHours(h,m,0,0);if(x<=d)x.setDate(x.getDate()+1);
  const n=Math.round((x-d)/60000);return'Rings in '+(n>=60?Math.floor(n/60)+'h ':'')+n%60+'m'}
function ra(){$('#al').innerHTML=alarms.map(a=>`<div class="card al ${a.on?'':'off'}"><div><b>${hm(a.t)}</b><div class="mu">${esc(a.n)||'Alarm'}, ${nxt(a)}</div></div>
  <div class="ac"><button data-e="${a.id}">Edit</button><button class="d" data-x="${a.id}">Delete</button><input type="checkbox" class="sw" data-i="${a.id}" ${a.on?'checked':''} aria-label="Alarm on or off"></div></div>`).join('');$('#ae').hidden=alarms.length>0}
function fin(){edit=null;$('#an').value='';$('#aa').textContent='Add alarm';$('#ac').hidden=true;sv('alarms',alarms);ra()}
$('#aa').onclick=()=>{const t=$('#at').value;if(!t)return;const n=$('#an').value.trim();
  if(edit){const a=alarms.find(a=>a.id==edit);if(a){a.t=t;a.n=n;a.on=true}}else alarms.push({id:Date.now(),t,n,on:true});fin()};
$('#ac').onclick=fin;
$('#al').onclick=e=>{const{e:ed,x,i}=e.target.dataset;
  if(ed){const a=alarms.find(a=>a.id==ed);edit=a.id;$('#at').value=a.t;$('#an').value=a.n||'';$('#aa').textContent='Save changes';$('#ac').hidden=false;$('#at').focus();return}
  if(x){alarms=alarms.filter(a=>a.id!=x);if(edit==x)edit=null}else if(i){alarms.find(a=>a.id==i).on=e.target.checked}else return;fin()};
function chk(d){const k=`${p2(d.getHours())}:${p2(d.getMinutes())}`;
  alarms.forEach(a=>{if(a.on&&a.t===k&&fired[a.id]!==k+d.getDate()){fired[a.id]=k+d.getDate();ring(a.n||'Alarm')}})}

/* Stopwatch */
const sw={run:false,st:0,acc:0,laps:[]};
const fm=ms=>{const c=Math.floor(ms/10)%100,s=Math.floor(ms/1000)%60,m=Math.floor(ms/60000);return`${p2(m)}:${p2(s)}.${p2(c)}`};
const swt=()=>sw.acc+(sw.run?performance.now()-sw.st:0);
function swb(){$('#sgo').textContent=sw.run?'Pause':(sw.acc?'Resume':'Start');$('#slap').disabled=!sw.run}
$('#sgo').onclick=()=>{if(sw.run){sw.acc=swt();sw.run=false;$('#swd').textContent=fm(sw.acc)}else{sw.st=performance.now();sw.run=true}swb()};
$('#slap').onclick=()=>{const t=swt(),p=sw.laps.length?sw.laps[0].t:0;sw.laps.unshift({t,d:t-p});rl()};
$('#srs').onclick=()=>{sw.run=false;sw.acc=0;sw.laps=[];$('#swd').textContent='00:00.00';swb();rl()};
function rl(){$('#lc').hidden=!sw.laps.length;$('#laps').innerHTML=sw.laps.map((l,i)=>`<div class="lap"><span class="mu">Lap ${sw.laps.length-i}</span><b>${fm(l.d)}</b><span class="mu">${fm(l.t)}</span></div>`).join('')}

/* Timer */
const tm={run:false,end:0,left:0,tot:0},CI=553;
const tf=ms=>{const s=Math.ceil(ms/1000);return`${p2(Math.floor(s/3600))}:${p2(Math.floor(s/60)%60)}:${p2(s%60)}`};
const tin=()=>((+$('#tmm').value||0)*60+Math.min(59,+$('#tms').value||0))*1000;
function tb(){$('#tgo').textContent=tm.run?'Pause':(tm.left?'Resume':'Start');$('#tin').hidden=tm.run||tm.left>0}
function tsh(){const r=tm.run?Math.max(0,tm.end-performance.now()):(tm.left||tin());$('#tmd').textContent=tf(r);
  $('#pr').setAttribute('stroke-dashoffset',(CI*(1-Math.min(1,tm.tot?r/tm.tot:1))).toFixed(1))}
$('#tgo').onclick=()=>{if(tm.run){tm.left=tm.end-performance.now();tm.run=false}else{if(!tm.left){tm.left=tin();tm.tot=tm.left}if(tm.left<=0)return;tm.end=performance.now()+tm.left;tm.run=true}tb();tsh()};
$('#trs').onclick=()=>{tm.run=false;tm.left=0;tm.tot=0;tb();tsh()};
['#tmm','#tms'].forEach(s=>$(s).oninput=tsh);

/* Main loop */
function loop(){const d=new Date();let s=d.getSeconds()+d.getMilliseconds()/1000;if(RM)s=Math.floor(s);
  const m=d.getMinutes()+s/60,h=d.getHours()%12+m/60;
  if(cur==='clock'){rot('#sh',s*6);rot('#mh',m*6);rot('#hh',h*30)}
  if(d.getSeconds()!==lastSec){lastSec=d.getSeconds();tick();
    if(cur==='clock'){const t=ft(d.getHours(),d.getMinutes(),d.getSeconds());$('#dig').innerHTML=t[0]+(t[1]?`<small>${t[1]}</small>`:'');
      $('#dt').textContent=d.toLocaleDateString('en-GB',{weekday:'long',day:'numeric',month:'long',year:'numeric'})}
    if(cur==='world')world(d);
    if(d.getMinutes()!==lastMin){lastMin=d.getMinutes();ra()}
    chk(d)}
  if(sw.run&&cur==='sw')$('#swd').textContent=fm(swt());
  if(tm.run){const r=tm.end-performance.now();if(r<=0){tm.run=false;tm.left=0;tm.tot=0;tb();tsh();ring('Timer complete');
    $('#tm').classList.add('done');setTimeout(()=>$('#tm').classList.remove('done'),3500)}else if(cur==='tm')tsh()}
  requestAnimationFrame(loop)}

apply();tb();tsh();rl();loop();
setTimeout(()=>{const x=$('#sp');x&&x.remove()},2300);
</script>
</body>
</html>
